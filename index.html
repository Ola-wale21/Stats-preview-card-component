<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>   <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Stats preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
<div class="container">
  <div class="first">
    <div class="glass"></div>
    <picture>
      <source srcset="images/image-header-desktop.jpg" media="(min-width: 600px)">
      <img src="images/image-header-mobile.jpg" alt="mobile view">
    </picture>
  </div>
  <div class="second">
    <h2>Get <span>insights </span>that help your business grow.</h2>
    <p> Discover the benefits of data analytics and make better decisions regarding revenue, customer 
      experience, and overall efficiency.</p>
    <section>
      <div>
        <p class="amount">10k+</p>
        <p class="value">COMPANIES</p>
      </div>
      <div>
        <p class="amount">314</p>
        <p class="value">TEMPLATE</p>
      </div>
      <div>
        <p class="amount">12M+ </p>
        <p class="value">QUERIES</p>
      </div>
    </section>
  </div>
</div>
  

 

   
 
 

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </div>
</body>
</html>
